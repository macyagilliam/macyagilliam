name: Site check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with the GitHub Pages dependencies
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --safe --strict_front_matter
      - name: Check internal links and images
        run: bundle exec ruby scripts/check_site.rb
