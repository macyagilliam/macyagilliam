<figure class="image">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'eager' | escape }}" decoding="async"{% if include.width %} width="{{ include.width | escape }}"{% endif %}{% if include.height %} height="{{ include.height | escape }}"{% endif %}>
  {% if include.caption %}<figcaption>{{ include.caption | escape }}</figcaption>{% endif %}
</figure>
