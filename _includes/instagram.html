<figure class="video video--portrait">
  {% if include.code and include.code != "" %}
  <div class="video-frame">
    <iframe src="https://www.instagram.com/reel/{{ include.code | escape }}/embed/" title="{{ include.title | escape }}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  {% else %}
  <div class="video-frame media-placeholder">
    <p><strong>Instagram reel placeholder</strong><br>Add a reel code and a descriptive title in this page.</p>
  </div>
  {% endif %}
</figure>
